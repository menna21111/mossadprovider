name: mosaedprovider
description: "Mosaed Provider App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.1
  equatable: ^2.0.5
  flutter_screenutil: ^5.9.0
  flutter_bloc: ^8.1.3
  easy_localization: ^3.0.3
  shared_preferences: ^2.2.2
  get_it: ^7.6.4
  jwt_decoder: ^2.0.1
  flutter_styled_toast: ^2.2.1
  intl: ^0.20.2
  internet_connection_checker: ^1.0.0+1
  dots_indicator: ^3.0.0
  carousel_slider_plus: ^7.0.0
  page_transition: ^2.1.0
  pretty_dio_logger: ^1.3.1
  dartz: ^0.10.1
  dio: ^5.3.3
  flutter_svg: ^2.0.7
  url_launcher: ^6.2.5
  audioplayers: ^5.2.1
  path_provider: ^2.1.5
  shimmer: ^3.0.0
  video_player: ^2.8.2
  pinput: ^3.0.1
  lottie: ^3.3.2
  record: ^6.2.0
  permission_handler: ^12.0.1
  animate_do: ^4.2.0
  infinite_scroll_pagination: 5.1.1
  webview_flutter: ^4.13.1
  local_auth: ^2.3.0
  google_maps_flutter: ^2.10.0
  geolocator: ^14.0.1
  image_picker: ^1.1.2
  web_socket_channel: ^3.0.3
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^17.2.3
  firebase_core: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/sound/
    - assets/translations/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
